name: Verify adapter POC
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Test the source first, then build the JAR used by the runnable examples.
      - name: Tests and executable JAR
        run: ./gradlew --no-daemon test bootJar
      # This also checks real YAML binding, previews, and customer/IT result files.
      - name: Compare every packaged example with expected JSON
        run: python scripts/verify-examples.py
