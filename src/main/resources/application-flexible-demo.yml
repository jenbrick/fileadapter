                    item:
                      object:
                        consentGuid:
                          source: resolved.providerConsentGuid
                          default-json: 'null'
                        consentTarget:
                          literal-json: '"PCDS"'
                        consentStatus:
                          source: PROVIDER_CLINICAL_CONSENT_PREFERENCE
                          required: true
                          transforms:
                          - trim
                          - uppercase
                          values:
                            GRANT: GRANT
                            RVOKE: RVOKE
                        consentOwner:
                          source: resolved.owner
                          required: true
                        effectiveDate:
                          source: PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE
                          required: true
                          transforms:
                          - trim
                          - iso-date
                        effectiveEndDate:
                          literal-json: 'null'
                        coverage:
                          literal-json: '[]'
                        transactionDetails:
                          object:
                            sourceSystem:
                              source: PROVIDER_SOURCE_SYSTEM
                              required: true
                              transforms:
                              - trim
                              default-value: MDB
                            sourceDateTime:
                              source: SOURCE_DATETIME
                              required: true
                              transforms:
                              - trim
                            sourceTransactionIdentifier:
                              source: SOURCE_USER
                              required: true
                              transforms:
                              - trim
                              default-value: fileadapter
                        consentManager:
                          source: resolved.manager
                          required: true
                  - where:
                      source: PAYER_CONSENT_PREFERENCE
                      present: true
                    group-by:
                    - resolved.owner.contractMemberGuid
                    - PAYER_CONSENT_KEY
                    item:
                      object:
                        consentGuid:
                          source: resolved.payerConsentGuid
                          default-json: 'null'
                        consentTarget:
                          literal-json: '"P2PDS"'
                        consentStatus:
                          source: PAYER_CONSENT_PREFERENCE
                          required: true
                          transforms:
                          - trim
                          - uppercase
                          values:
                            GRANT: GRANT
                            RVOKE: RVOKE
                        consentOwner:
                          source: resolved.owner
                          required: true
                        effectiveDate:
                          source: PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE
                          required: true
                          transforms:
                          - trim
                          - iso-date
                        effectiveEndDate:
                          literal-json: 'null'
                        coverage:
                          array:
                          - where:
                              any-present:
                              - PAYER_ID
                              - PAYER_POLICY_ID
                              - PAYER_GROUP_NUMBER
                              - PAYER_SUBSCRIBER_FIRST_NAME
                              - PAYER_SUBSCRIBER_LAST_NAME
                              - PAYER_SUBSCRIBER_MIDDLE_NAME
                              - PAYER_GENDER_CODE
                              - PAYER_DATE_OF_BIRTH
                            group-by:
                            - PAYER_ID
                            - PAYER_POLICY_ID
                            item:
                              object:
                                payerId:
                                  source: PAYER_ID
                                  required: true
                                  transforms:
                                  - trim
                                otherPayerMemberId:
                                  source: PAYER_POLICY_ID
                                  required: true
                                  transforms:
                                  - trim
                                groupNumber:
                                  source: PAYER_GROUP_NUMBER
                                  transforms:
                                  - trim
                                  blank-policy: 'NULL'
                                policyHolderFirstName:
                                  source: PAYER_SUBSCRIBER_FIRST_NAME
                                  transforms:
                                  - trim
                                  blank-policy: 'NULL'
                                policyHolderMiddleName:
                                  source: PAYER_SUBSCRIBER_MIDDLE_NAME
                                  transforms:
                                  - trim
                                  blank-policy: 'NULL'
                                policyHolderLastName:
                                  source: PAYER_SUBSCRIBER_LAST_NAME
                                  transforms:
                                  - trim
                                  blank-policy: 'NULL'
                                policyHolderGender:
                                  source: PAYER_GENDER_CODE
                                  transforms:
                                  - trim
                                  - uppercase
                                  blank-policy: 'NULL'
                                policyHolderDateOfBirth:
                                  source: PAYER_DATE_OF_BIRTH
                                  required: true
                                  transforms:
                                  - trim
                                  - iso-date
                                relationshipToPolicyHolder:
                                  source: RELATIONSHIP_CODE
                                  required: true
                                  transforms:
                                  - trim
                                  - uppercase
                                  values:
                                    SELF: SELF
                                    SPOUSE: SPOUSE
                                    DEPENDENT: DEPENDENT
                                    OTHER: OTHER
                        transactionDetails:
                          object:
                            sourceSystem:
                              source: PAYER_SOURCE_SYSTEM
                              required: true
                              transforms:
                              - trim
                              default-value: MDB
                            sourceDateTime:
                              source: SOURCE_DATETIME
                              required: true
                              transforms:
                              - trim
                            sourceTransactionIdentifier:
                              source: SOURCE_USER
                              required: true
                              transforms:
                              - trim
                              default-value: fileadapter
                        consentManager:
                          source: resolved.manager
                          required: true
        batching:
          group-by:
          - resolved.owner.contract
          max-groups-per-request: ${CONTRACTS_PER_REQUEST:2}
          max-records-per-group: ${CONTRACT_MAX_ROWS:100}
          member-key: resolved.owner.contractMemberGuid
          max-members-per-group: ${CONTRACT_MAX_MEMBERS:25}
          where:
            any-present:
            - PROVIDER_CLINICAL_CONSENT_PREFERENCE
            - PAYER_CONSENT_PREFERENCE
      errors:
        contract-key: EXTERNAL_CONTRACT_ID
        enrichment-severity: MEDIUM
        projection-severity: MEDIUM
        service-codes: *id001
