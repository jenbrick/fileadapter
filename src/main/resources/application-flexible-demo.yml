# Generic JSON projection POC. The consent domain is configuration plus an optional enricher.
ingestion:
  poll-enabled: false
  mode: PREVIEW
  work-directory: ./var-flexible-demo
  profiles:
    - id: flexible-csv-v1
      filename-pattern: flexible-consents{,-header*}.csv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: FIRST_RECORD
      # Resolve the source group first. Its internal IDs are needed for member matching.
      group: &groupLookup
        version: group-lookup-v1
        source-field: EXTERNAL_GROUP_ID
        lookup:
          mode: ${GROUP_LOOKUP_MODE:FIXTURE}
          endpoint: ${GROUP_LOOKUP_URL:http://127.0.0.1:8083/groups/resolve}
          connect-timeout: 5s
          read-timeout: 10s
          fixtures:
          - external-group-id: EXT-GROUP-1
            result: {internal-group-number: '10001', customer-id: CUST-1}
          - external-group-id: EXT-GROUP-2
            result: {internal-group-number: '20002', customer-id: CUST-2}
          - external-group-id: EXT-GROUP-3
            result: {internal-group-number: '30003', customer-id: CUST-3}
      # This lookup sends member fields plus the group context, rather than the whole source row.
      consent: &memberLookup
        version: flexible-lookup-v1
        date-pattern: uuuu-MM-dd
        lookup:
          mode: ${FLEXIBLE_LOOKUP_MODE:FIXTURE}
          endpoint: ${CONSENT_LOOKUP_URL:http://127.0.0.1:8082/members/resolve}
          connect-timeout: 5s
          read-timeout: 10s
          fixtures:
          - match:
              externalContractId: EXTERNAL-001
              internalGroupNumber: '10001'
              customerId: CUST-1
            result:
              owner:
                contract: '123456789'
                pin: '001'
                contractMemberGuid: MEMBER-GUID-001
              manager:
                contract: '123456789'
                pin: '001'
                contractMemberGuid: MEMBER-GUID-001
              providerConsentGuid: null
              payerConsentGuid: null
          - match:
              externalContractId: EXTERNAL-002
              internalGroupNumber: '10001'
              customerId: CUST-1
            result:
              owner:
                contract: '123456789'
                pin: '002'
                contractMemberGuid: MEMBER-GUID-002
              manager:
                contract: '123456789'
                pin: '002'
                contractMemberGuid: MEMBER-GUID-002
              providerConsentGuid: null
              payerConsentGuid: null
      # This template builds the outgoing consent body. Changing it does not change either lookup.
      projection: &consentProjection
        version: flexible-consents-v1
        scope: FILE
        max-records: 1000
        enrichers:
        - group-context
        - consent-member
        input-contract:
        - path: PROVIDER_CLINICAL_CONSENT_PREFERENCE
          type: STRING
          required: true
          nullable: true
        - path: PAYER_CONSENT_PREFERENCE
          type: STRING
          required: true
          nullable: true
        skip-when-empty: consents
        root:
          object:
            # Reuse this collection in the alternate wrappers below.
            consents: &consentArray
              array:
              - where:
                  source: PROVIDER_CLINICAL_CONSENT_PREFERENCE
                  present: true
                group-by:
                - resolved.owner.contractMemberGuid
                item:
                  object:
                    consentGuid:
                      source: resolved.providerConsentGuid
                      default-json: 'null'
                    consentTarget:
                      literal-json: '"PCDS"'
                    consentStatus:
                      source: PROVIDER_CLINICAL_CONSENT_PREFERENCE
                      required: true
                      transforms:
                      - trim
                      - uppercase
                      values:
                        GRANT: GRANT
                        RVOKE: RVOKE
                    consentOwner:
                      source: resolved.owner
                      required: true
                    effectiveDate:
                      source: PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE
                      required: true
                      transforms:
                      - trim
                      - iso-date
                    effectiveEndDate:
                      literal-json: 'null'
                    coverage:
                      literal-json: '[]'
                    transactionDetails:
                      object:
                        sourceSystem:
                          source: PROVIDER_SOURCE_SYSTEM
                          required: true
                          transforms:
                          - trim
                          default-value: MDB
                        sourceDateTime:
                          source: SOURCE_DATETIME
                          required: true
                          transforms:
                          - trim
                        sourceTransactionIdentifier:
                          source: SOURCE_USER
                          required: true
                          transforms:
                          - trim
                          default-value: fileadapter
                    consentManager:
                      source: resolved.manager
                      required: true
              - where:
                  source: PAYER_CONSENT_PREFERENCE
                  present: true
                group-by:
                - resolved.owner.contractMemberGuid
                item:
                  object:
                    consentGuid:
                      source: resolved.payerConsentGuid
                      default-json: 'null'
                    consentTarget:
                      literal-json: '"P2PDS"'
                    consentStatus:
                      source: PAYER_CONSENT_PREFERENCE
                      required: true
                      transforms:
                      - trim
                      - uppercase
                      values:
                        GRANT: GRANT
                        RVOKE: RVOKE
                    consentOwner:
                      source: resolved.owner
                      required: true
                    effectiveDate:
                      source: PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE
                      required: true
                      transforms:
                      - trim
                      - iso-date
                    effectiveEndDate:
                      literal-json: 'null'
                    coverage:
                      array:
                      - where:
                          any-present:
                          - PAYER_ID
                          - PAYER_POLICY_ID
                          - PAYER_GROUP_NUMBER
                          - PAYER_SUBSCRIBER_FIRST_NAME
                          - PAYER_SUBSCRIBER_LAST_NAME
                          - PAYER_SUBSCRIBER_MIDDLE_NAME
                          - PAYER_GENDER_CODE
                          - PAYER_DATE_OF_BIRTH
                        group-by:
                        - PAYER_ID
                        - PAYER_POLICY_ID
                        item:
                          object:
                            payerId:
                              source: PAYER_ID
                              required: true
                              transforms:
                              - trim
                            otherPayerMemberId:
                              source: PAYER_POLICY_ID
                              required: true
                              transforms:
                              - trim
                            groupNumber:
                              source: PAYER_GROUP_NUMBER
                              transforms:
                              - trim
                              blank-policy: 'NULL'
                            policyHolderFirstName:
                              source: PAYER_SUBSCRIBER_FIRST_NAME
                              transforms:
                              - trim
                              blank-policy: 'NULL'
                            policyHolderMiddleName:
                              source: PAYER_SUBSCRIBER_MIDDLE_NAME
                              transforms:
                              - trim
                              blank-policy: 'NULL'
                            policyHolderLastName:
                              source: PAYER_SUBSCRIBER_LAST_NAME
                              transforms:
                              - trim
                              blank-policy: 'NULL'
                            policyHolderGender:
                              source: PAYER_GENDER_CODE
                              transforms:
                              - trim
                              - uppercase
                              blank-policy: 'NULL'
                            policyHolderDateOfBirth:
                              source: PAYER_DATE_OF_BIRTH
                              required: true
                              transforms:
                              - trim
                              - iso-date
                            relationshipToPolicyHolder:
                              source: RELATIONSHIP_CODE
                              required: true
                              transforms:
                              - trim
                              - uppercase
                              values:
                                SELF: SELF
                                SPOUSE: SPOUSE
                                DEPENDENT: DEPENDENT
                                OTHER: OTHER
                    transactionDetails:
                      object:
                        sourceSystem:
                          source: PAYER_SOURCE_SYSTEM
                          required: true
                          transforms:
                          - trim
                          default-value: MDB
                        sourceDateTime:
                          source: SOURCE_DATETIME
                          required: true
                          transforms:
                          - trim
                        sourceTransactionIdentifier:
                          source: SOURCE_USER
                          required: true
                          transforms:
                          - trim
                          default-value: fileadapter
                    consentManager:
                      source: resolved.manager
                      required: true
    - id: flexible-pipe-v1
      filename-pattern: flexible-consents{,-header*}.psv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: '|'
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-xml-v1
      filename-pattern: flexible*.xml
      layout:
        charset: UTF-8
        format: XML
        xml:
          record-path: /members/member
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-json-v1
      filename-pattern: flexible-consents{,-array*}.json
      layout:
        charset: UTF-8
        format: JSON
        json:
          mode: ARRAY
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-fixed-v1
      filename-pattern: flexible*.fw
      layout:
        charset: UTF-8
        format: FIXED_WIDTH
        header-mode: NONE
        fixed-width:
          record-length: 1088
          columns:
          - name: EXTERNAL_CONTRACT_ID
            offset: 0
            length: 32
          - name: RELATIONSHIP_CODE
            offset: 32
