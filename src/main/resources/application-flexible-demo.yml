            length: 32
          - name: EXTERNAL_GROUP_ID
            offset: 224
            length: 32
          - name: PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE
            offset: 256
            length: 32
          - name: PROVIDER_CLINICAL_CONSENT_PREFERENCE
            offset: 288
            length: 32
          - name: PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE
            offset: 320
            length: 32
          - name: PAYER_CONSENT_PREFERENCE
            offset: 352
            length: 32
          - name: PAYER_NAME
            offset: 384
            length: 32
          - name: PAYER_ADDRESS_1
            offset: 416
            length: 32
          - name: PAYER_ADDRESS_2
            offset: 448
            length: 32
          - name: PAYER_CITY
            offset: 480
            length: 32
          - name: PAYER_STATE
            offset: 512
            length: 32
          - name: PAYER_ZIP
            offset: 544
            length: 32
          - name: PAYER_ID
            offset: 576
            length: 32
          - name: PAYER_POLICY_ID
            offset: 608
            length: 32
          - name: PAYER_GROUP_NUMBER
            offset: 640
            length: 32
          - name: PAYER_SUBSCRIBER_LAST_NAME
            offset: 672
            length: 32
          - name: PAYER_SUBSCRIBER_FIRST_NAME
            offset: 704
            length: 32
          - name: PAYER_SUBSCRIBER_MIDDLE_NAME
            offset: 736
            length: 32
          - name: PAYER_DATE_OF_BIRTH
            offset: 768
            length: 32
          - name: PAYER_GENDER_CODE
            offset: 800
            length: 32
          - name: PAYER_EFFECTIVE_DATE
            offset: 832
            length: 32
          - name: PAYER_CANCEL_DATE
            offset: 864
            length: 32
          - name: PAYER_PLAN_TYPE
            offset: 896
            length: 32
          - name: PAYER_COVERAGE_TYPE
            offset: 928
            length: 32
          - name: PROVIDER_SOURCE_SYSTEM
            offset: 960
            length: 32
          - name: PAYER_SOURCE_SYSTEM
            offset: 992
            length: 32
          - name: SOURCE_DATETIME
            offset: 1024
            length: 32
          - name: SOURCE_USER
            offset: 1056
            length: 32
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-root-array-v1
      filename-pattern: variant-root-array.unused
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent: *memberLookup
      projection:
        <<: *consentProjection
        version: flexible-root-array-v1
        skip-when-empty: "$"
        root: *consentArray
    - id: flexible-reshaped-v1
      filename-pattern: variant-reshaped.unused
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent: *memberLookup
      projection:
        version: flexible-reshaped-v1
        scope: FILE
        max-records: 1000
        enrichers:
        - group-context
        - consent-member
        input-contract:
        - path: PROVIDER_CLINICAL_CONSENT_PREFERENCE
          type: STRING
          required: true
          nullable: true
        - path: PAYER_CONSENT_PREFERENCE
          type: STRING
          required: true
          nullable: true
        skip-when-empty: payload.entries
        root:
          object:
            payload:
              object:
                entries:
                  array:
                  - where:
                      source: PROVIDER_CLINICAL_CONSENT_PREFERENCE
                      present: true
                    group-by:
                    - resolved.owner.contractMemberGuid
                    item:
                      object:
                        consentGuid:
                          source: resolved.providerConsentGuid
                          default-json: 'null'
                        consentTarget:
                          literal-json: '"PCDS"'
                        consentStatus:
                          source: PROVIDER_CLINICAL_CONSENT_PREFERENCE
                          required: true
                          transforms:
                          - trim
                          - uppercase
                          values:
                            GRANT: GRANT
                            RVOKE: RVOKE
                        consentOwner:
                          source: resolved.owner
                          required: true
                        effectiveDate:
                          source: PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE
                          required: true
                          transforms:
                          - trim
                          - iso-date
                        effectiveEndDate:
                          literal-json: 'null'
                        transactionDetails:
                          object:
                            sourceSystem:
                              source: PROVIDER_SOURCE_SYSTEM
                              required: true
                              transforms:
                              - trim
                              default-value: MDB
                            sourceDateTime:
                              source: SOURCE_DATETIME
                              required: true
                              transforms:
                              - trim
                            sourceTransactionIdentifier:
                              source: SOURCE_USER
                              required: true
                              transforms:
                              - trim
                              default-value: fileadapter
                            consentManager:
                              source: resolved.manager
                              required: true
                        payerInfo:
                          object:
                            coverages:
                              literal-json: '[]'
                  - where:
                      source: PAYER_CONSENT_PREFERENCE
                      present: true
                    group-by:
                    - resolved.owner.contractMemberGuid
                    item:
                      object:
                        consentGuid:
                          source: resolved.payerConsentGuid
                          default-json: 'null'
                        consentTarget:
                          literal-json: '"P2PDS"'
                        consentStatus:
                          source: PAYER_CONSENT_PREFERENCE
                          required: true
                          transforms:
                          - trim
                          - uppercase
                          values:
                            GRANT: GRANT
                            RVOKE: RVOKE
                        consentOwner:
                          source: resolved.owner
                          required: true
                        effectiveDate:
                          source: PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE
                          required: true
                          transforms:
                          - trim
                          - iso-date
                        effectiveEndDate:
                          literal-json: 'null'
                        transactionDetails:
                          object:
                            sourceSystem:
                              source: PAYER_SOURCE_SYSTEM
                              required: true
                              transforms:
                              - trim
                              default-value: MDB
                            sourceDateTime:
                              source: SOURCE_DATETIME
                              required: true
                              transforms:
                              - trim
                            sourceTransactionIdentifier:
                              source: SOURCE_USER
                              required: true
                              transforms:
                              - trim
                              default-value: fileadapter
                            consentManager:
                              source: resolved.manager
                              required: true
                        payerInfo:
                          object:
                            coverages:
                              array:
                              - where:
                                  any-present:
                                  - PAYER_ID
                                  - PAYER_POLICY_ID
                                  - PAYER_GROUP_NUMBER
                                  - PAYER_SUBSCRIBER_FIRST_NAME
                                  - PAYER_SUBSCRIBER_LAST_NAME
                                  - PAYER_SUBSCRIBER_MIDDLE_NAME
                                  - PAYER_GENDER_CODE
                                  - PAYER_DATE_OF_BIRTH
                                group-by:
                                - PAYER_ID
                                - PAYER_POLICY_ID
                                item:
                                  object:
                                    payerId:
                                      source: PAYER_ID
                                      required: true
                                      transforms:
                                      - trim
                                    otherPayerMemberId:
                                      source: PAYER_POLICY_ID
                                      required: true
                                      transforms:
                                      - trim
                                    groupNumber:
                                      source: PAYER_GROUP_NUMBER
                                      transforms:
                                      - trim
                                      blank-policy: 'NULL'
                                    policyHolderFirstName:
                                      source: PAYER_SUBSCRIBER_FIRST_NAME
                                      transforms:
                                      - trim
                                      blank-policy: 'NULL'
                                    policyHolderMiddleName:
                                      source: PAYER_SUBSCRIBER_MIDDLE_NAME
                                      transforms:
                                      - trim
                                      blank-policy: 'NULL'
                                    policyHolderLastName:
                                      source: PAYER_SUBSCRIBER_LAST_NAME
                                      transforms:
                                      - trim
                                      blank-policy: 'NULL'
                                    policyHolderGender:
                                      source: PAYER_GENDER_CODE
                                      transforms:
                                      - trim
                                      - uppercase
                                      blank-policy: 'NULL'
                                    policyHolderDateOfBirth:
                                      source: PAYER_DATE_OF_BIRTH
                                      required: true
                                      transforms:
                                      - trim
                                      - iso-date
                                    relationshipToPolicyHolder:
                                      source: RELATIONSHIP_CODE
                                      required: true
                                      transforms:
                                      - trim
                                      - uppercase
                                      values:
                                        SELF: SELF
                                        SPOUSE: SPOUSE
                                        DEPENDENT: DEPENDENT
                                        OTHER: OTHER
    - id: flexible-record-v1
      filename-pattern: variant-record.unused
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: FIRST_RECORD
      projection:
        version: row-example-v1
        scope: RECORD
        max-records: 1000
        root:
          object:
            person:
              object:
                firstName:
                  source: FIRST_NAME
                  required: true
                  transforms:
                  - trim
                lastName:
                  source: LAST_NAME
                  required: true
                  transforms:
                  - trim
    - id: flexible-semicolon-v1
      filename-pattern: flexible*.scsv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ';'
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-tab-v1
      filename-pattern: flexible*.tsv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: "\t"
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-csv-noheader-v1
      filename-pattern: flexible-noheader*.csv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: NONE
        columns: ["EXTERNAL_CONTRACT_ID", "RELATIONSHIP_CODE", "LAST_NAME", "FIRST_NAME", "MIDDLE_NAME", "GENDER_CODE", "DATE_OF_BIRTH", "EXTERNAL_GROUP_ID", "PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE", "PROVIDER_CLINICAL_CONSENT_PREFERENCE", "PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE", "PAYER_CONSENT_PREFERENCE", "PAYER_NAME", "PAYER_ADDRESS_1", "PAYER_ADDRESS_2", "PAYER_CITY", "PAYER_STATE", "PAYER_ZIP", "PAYER_ID", "PAYER_POLICY_ID", "PAYER_GROUP_NUMBER", "PAYER_SUBSCRIBER_LAST_NAME", "PAYER_SUBSCRIBER_FIRST_NAME", "PAYER_SUBSCRIBER_MIDDLE_NAME", "PAYER_DATE_OF_BIRTH", "PAYER_GENDER_CODE", "PAYER_EFFECTIVE_DATE", "PAYER_CANCEL_DATE", "PAYER_PLAN_TYPE", "PAYER_COVERAGE_TYPE", "PROVIDER_SOURCE_SYSTEM", "PAYER_SOURCE_SYSTEM", "SOURCE_DATETIME", "SOURCE_USER"]
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-psv-noheader-v1
      filename-pattern: flexible-noheader*.psv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: '|'
        header-mode: NONE
        columns: ["EXTERNAL_CONTRACT_ID", "RELATIONSHIP_CODE", "LAST_NAME", "FIRST_NAME", "MIDDLE_NAME", "GENDER_CODE", "DATE_OF_BIRTH", "EXTERNAL_GROUP_ID", "PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE", "PROVIDER_CLINICAL_CONSENT_PREFERENCE", "PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE", "PAYER_CONSENT_PREFERENCE", "PAYER_NAME", "PAYER_ADDRESS_1", "PAYER_ADDRESS_2", "PAYER_CITY", "PAYER_STATE", "PAYER_ZIP", "PAYER_ID", "PAYER_POLICY_ID", "PAYER_GROUP_NUMBER", "PAYER_SUBSCRIBER_LAST_NAME", "PAYER_SUBSCRIBER_FIRST_NAME", "PAYER_SUBSCRIBER_MIDDLE_NAME", "PAYER_DATE_OF_BIRTH", "PAYER_GENDER_CODE", "PAYER_EFFECTIVE_DATE", "PAYER_CANCEL_DATE", "PAYER_PLAN_TYPE", "PAYER_COVERAGE_TYPE", "PROVIDER_SOURCE_SYSTEM", "PAYER_SOURCE_SYSTEM", "SOURCE_DATETIME", "SOURCE_USER"]
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-json-object-v1
      filename-pattern: flexible-object*.json
      layout:
        charset: UTF-8
        format: JSON
        json:
          mode: OBJECT
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-json-lines-v1
      filename-pattern: flexible*.jsonl
      layout:
        charset: UTF-8
        format: JSON
        json:
          mode: LINES
      group: *groupLookup
      consent: *memberLookup
      projection: *consentProjection
    - id: flexible-contract-envelope-v1
      filename-pattern: variant-contract.unused
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent: *memberLookup
      projection:
        <<: *consentProjection
        version: flexible-contract-envelope-v1
        root:
          object:
            contractId:
              source: resolved.owner.contract
              required: true
            consents: *consentArray

    # Bounded complete-contract requests; resolve members within shared external contracts.
    # One complete contract per POST. Repeated member/payer rows stay together.
    - id: flexible-contract-single-v1
      filename-pattern: contract-batches*.csv
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ','
        header-mode: FIRST_RECORD
      group: *groupLookup
      consent:
        version: flexible-lookup-v1
        date-pattern: uuuu-MM-dd
        lookup:
          mode: ${FLEXIBLE_LOOKUP_MODE:FIXTURE}
          endpoint: ${CONSENT_LOOKUP_URL:http://127.0.0.1:8082/members/resolve}
          connect-timeout: 5s
          read-timeout: 10s
          fixtures:
          - match:
              externalContractId: EXT-CONTRACT-A
              firstName: Alex
              lastName: Example
              dateOfBirth: '1980-01-01'
              internalGroupNumber: '10001'
              customerId: CUST-1
            result:
              owner:
                contract: '123456789'
                pin: '001'
                contractMemberGuid: MEMBER-GUID-001
              manager:
                contract: '123456789'
                pin: '001'
                contractMemberGuid: MEMBER-GUID-001
              providerConsentGuid: null
              payerConsentGuid: null
          - match:
              externalContractId: EXT-CONTRACT-A
              firstName: John
              lastName: Smith
              dateOfBirth: '1980-01-01'
              internalGroupNumber: '10001'
              customerId: CUST-1
            result:
              owner:
                contract: '123456789'
                pin: '002'
                contractMemberGuid: MEMBER-GUID-002
              manager:
                contract: '123456789'
                pin: '002'
                contractMemberGuid: MEMBER-GUID-002
              providerConsentGuid: null
              payerConsentGuid: null
          - match:
              externalContractId: EXT-CONTRACT-B
              firstName: Morgan
              lastName: Chen
              dateOfBirth: '1980-01-01'
              internalGroupNumber: '20002'
              customerId: CUST-2
            result:
              owner:
                contract: '222222222'
                pin: '001'
                contractMemberGuid: MEMBER-GUID-003
              manager:
                contract: '222222222'
