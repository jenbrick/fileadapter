spring:
  application:
    name: fileadapter
  main:
    web-application-type: none
    banner-mode: off

ingestion:
  work-directory: ${FILEADAPTER_WORK_DIR:./var}
  input-directory: ${FILEADAPTER_INPUT_DIR:./var/incoming}
  mode: ${FILEADAPTER_MODE:PREVIEW}
  poll-enabled: true
  poll-interval: 5s
  minimum-age: 2s
  ready-suffix: .ready

  delivery:
    endpoint: ${UPSERT_URL:http://localhost:8081/employees/upsert}
    connect-timeout: 5s
    read-timeout: 30s
    max-attempts: 3
    retry-delay: 1s
    # Enable ONLY after the service guarantees idempotency for this header.
    replay-safe: false
    idempotency-header: Idempotency-Key
    success-statuses: [200, 201, 204]

  profiles:
    - id: enrollment-csv-v1
      filename-pattern: "enrollment*.csv"
      layout:
        format: DELIMITED
        charset: UTF-8
        delimiter: ","
        header-mode: FIRST_RECORD
        fields: &csvFields
          employeeId:
            column: employee_id
            aliases: [employee_number, emp_id]
          firstName:
            column: first_name
          lastName:
            column: last_name
          email:
            column: email_address
            aliases: [email]
          city:
            column: city
          state:
            column: state
          planCode:
            column: plan_code
          effectiveDate:
            column: effective_date

      mappings: &employeeMappings
        - source: employeeId
          target: employeeId
          required: true
          transforms: [trim]
        - source: firstName
          target: person.firstName
          required: true
          transforms: [trim]
        - source: lastName
          target: person.lastName
          required: true
          transforms: [trim]
        - source: email
          target: person.contact.email
          blank-policy: OMIT
          transforms: [trim]
        - source: city
          target: person.address.city
          transforms: [trim]
        - source: state
          target: person.address.state
          transforms: [trim, uppercase]
        - source: planCode
          target: coverage.planCode
          required: true
          transforms: [trim]
        - source: effectiveDate
          target: coverage.effectiveDate
          required: true
          transforms: [trim, iso-date]

      contract: &employeeContract
        - path: employeeId
          type: STRING
          required: true
        - path: person
          type: OBJECT
          required: true
        - path: person.firstName
          type: STRING
          required: true
        - path: person.lastName
          type: STRING
          required: true
        - path: person.contact.email
          type: STRING
        - path: coverage.planCode
          type: STRING
          required: true
        - path: coverage.effectiveDate
          type: STRING
          required: true


    - id: enrollment-fixed-v1
      filename-pattern: "enrollment*.fw"
      layout:
        format: FIXED_WIDTH
        charset: UTF-8
        header-mode: NONE
        fields: *csvFields
        fixed-width:
          record-length: 106
          columns:
            - { name: employee_id, offset: 0, length: 8 }
            - { name: first_name, offset: 8, length: 12 }
            - { name: last_name, offset: 20, length: 16 }
            - { name: email, offset: 36, length: 28 }
            - { name: city, offset: 64, length: 14 }
            - { name: state, offset: 78, length: 2 }
            - { name: plan_code, offset: 80, length: 16 }
            - { name: effective_date, offset: 96, length: 10 }
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-pipe-header-v1
      filename-pattern: "enrollment-header*.psv"
      layout:
        format: DELIMITED
        charset: UTF-8
        delimiter: "|"
        header-mode: FIRST_RECORD
        fields: *csvFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-pipe-noheader-v1
      filename-pattern: "enrollment-noheader*.psv"
      layout:
        format: DELIMITED
        charset: UTF-8
        delimiter: "|"
        header-mode: NONE
        columns: [employee_id, first_name, last_name, email, city, state, plan_code, effective_date]
        fields: *csvFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-xml-v1
      filename-pattern: "enrollment*.xml"
      layout:
        format: XML
        charset: UTF-8
        xml:
          record-path: /employees/employee
        fields:
          employeeId: { column: "/@id" }
          firstName: { column: /person/firstName }
          lastName: { column: /person/lastName }
          email: { column: /person/contact/email }
          city: { column: /person/address/city }
          state: { column: /person/address/state }
          planCode: { column: /coverage/planCode }
          effectiveDate: { column: /coverage/effectiveDate }
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-json-array-v1
      filename-pattern: "enrollment-array*.json"
      layout:
        format: JSON
        charset: UTF-8
        json: { mode: ARRAY }
        fields: &jsonFields
          employeeId: { column: employeeId }
          firstName: { column: /person/firstName }
          lastName: { column: /person/lastName }
          email: { column: /person/contact/email }
          city: { column: /person/address/city }
          state: { column: /person/address/state }
          planCode: { column: /coverage/planCode }
          effectiveDate: { column: /coverage/effectiveDate }
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-json-object-v1
      filename-pattern: "enrollment-object*.json"
      layout:
        format: JSON
        charset: UTF-8
        json: { mode: OBJECT }
        fields: *jsonFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-json-lines-v1
      filename-pattern: "enrollment*.jsonl"
      layout:
        format: JSON
        charset: UTF-8
        json: { mode: LINES }
        fields: *jsonFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: cms-consent-csv-v1
      filename-pattern: "consent{,-header*}.csv"
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ","
        header-mode: FIRST_RECORD

      consent: &consentRules
        version: cms-consent-v2
        provider-target: PCDS
        payer-target: P2PDS
        preferences: { GRANT: GRANT, RVOKE: RVOKE }
        relationships: { SELF: SELF, SPOUSE: SPOUSE, DEPENDENT: DEPENDENT, OTHER: OTHER }
        date-pattern: uuuu-MM-dd
        source-system: ${CONSENT_SOURCE_SYSTEM:MDB}
        source-transaction-identifier: ${CONSENT_SOURCE_TRANSACTION:${consent.demo-source-transaction:fileadapter}}
        # If blank, capture UTC time once per resolved source row and persist it with the plan.
        source-date-time: ${CONSENT_SOURCE_DATETIME:${consent.demo-source-datetime:}}
        lookup:
          mode: ${consent.lookup-mode:HTTP}
          endpoint: ${CONSENT_LOOKUP_URL:http://localhost:8082/members/resolve}
          connect-timeout: 5s
          read-timeout: 10s
          # Synthetic fixtures are used only with the consent-demo Spring profile.
          fixtures:
            - {"match": {"EXTERNAL_CONTRACT_ID": "SYN-1001", "RELATIONSHIP_CODE": "SELF", "FIRST_NAME": "Alex", "LAST_NAME": "Example", "DATE_OF_BIRTH": "1980-01-02"}, "result": {"owner": {"contract": "990000001", "pin": "001", "contractMemberGuid": "SYN-MEMBER-1"}, "manager": {"contract": "990000001", "pin": "001", "contractMemberGuid": "SYN-MEMBER-1"}, "providerConsentGuid": null, "payerConsentGuid": "SYN-CONSENT-20001"}}
            - {"match": {"EXTERNAL_CONTRACT_ID": "SYN-1002", "RELATIONSHIP_CODE": "SELF", "FIRST_NAME": "Blair", "LAST_NAME": "Example", "DATE_OF_BIRTH": "1980-01-02"}, "result": {"owner": {"contract": "990000002", "pin": "001", "contractMemberGuid": "SYN-MEMBER-2"}, "manager": {"contract": "990000002", "pin": "001", "contractMemberGuid": "SYN-MEMBER-2"}, "providerConsentGuid": null, "payerConsentGuid": null}}
            - {"match": {"EXTERNAL_CONTRACT_ID": "SYN-1003", "RELATIONSHIP_CODE": "DEPENDENT", "FIRST_NAME": "Casey", "LAST_NAME": "Example", "DATE_OF_BIRTH": "2012-04-03"}, "result": {"owner": {"contract": "990000003", "pin": "00A", "contractMemberGuid": "SYN-MEMBER-3"}, "manager": {"contract": "990000003", "pin": "XYZ", "contractMemberGuid": "SYN-GUARDIAN-3"}, "providerConsentGuid": null, "payerConsentGuid": null}}
            - {"match": {"EXTERNAL_CONTRACT_ID": "SYN-1004", "RELATIONSHIP_CODE": "SELF", "FIRST_NAME": "Drew", "LAST_NAME": "Example", "DATE_OF_BIRTH": "1980-01-02"}, "result": {"owner": {"contract": "990000004", "pin": "001", "contractMemberGuid": "SYN-MEMBER-4"}, "manager": {"contract": "990000004", "pin": "001", "contractMemberGuid": "SYN-MEMBER-4"}, "providerConsentGuid": null, "payerConsentGuid": null}}
            - {"match": {"EXTERNAL_CONTRACT_ID": "SYN-1005", "RELATIONSHIP_CODE": "SELF", "FIRST_NAME": "Ellis", "LAST_NAME": "Example", "DATE_OF_BIRTH": "1980-01-02"}, "result": {"owner": {"contract": "990000005", "pin": "001", "contractMemberGuid": "SYN-MEMBER-5"}, "manager": {"contract": "990000005", "pin": "001", "contractMemberGuid": "SYN-MEMBER-5"}, "providerConsentGuid": null, "payerConsentGuid": null}}

    - id: cms-consent-csv-noheader-v1
      filename-pattern: "consent-noheader*.csv"
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: ","
        header-mode: NONE
        columns: ["EXTERNAL_CONTRACT_ID", "RELATIONSHIP_CODE", "LAST_NAME", "FIRST_NAME", "MIDDLE_NAME", "GENDER_CODE", "DATE_OF_BIRTH", "EXTERNAL_GROUP_ID", "PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE", "PROVIDER_CLINICAL_CONSENT_PREFERENCE", "PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE", "PAYER_CONSENT_PREFERENCE", "PAYER_NAME", "PAYER_ADDRESS_1", "PAYER_ADDRESS_2", "PAYER_CITY", "PAYER_STATE", "PAYER_ZIP", "PAYER_ID", "PAYER_POLICY_ID", "PAYER_GROUP_NUMBER", "PAYER_SUBSCRIBER_LAST_NAME", "PAYER_SUBSCRIBER_FIRST_NAME", "PAYER_SUBSCRIBER_MIDDLE_NAME", "PAYER_DATE_OF_BIRTH", "PAYER_GENDER_CODE", "PAYER_EFFECTIVE_DATE", "PAYER_CANCEL_DATE", "PAYER_PLAN_TYPE", "PAYER_COVERAGE_TYPE"]
      consent: *consentRules

    - id: cms-consent-pipe-header-v1
      filename-pattern: "consent-header*.psv"
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: "|"
        header-mode: FIRST_RECORD
      consent: *consentRules

    - id: cms-consent-pipe-noheader-v1
      filename-pattern: "consent-noheader*.psv"
      layout:
        charset: UTF-8
        format: DELIMITED
        delimiter: "|"
        header-mode: NONE
        columns: ["EXTERNAL_CONTRACT_ID", "RELATIONSHIP_CODE", "LAST_NAME", "FIRST_NAME", "MIDDLE_NAME", "GENDER_CODE", "DATE_OF_BIRTH", "EXTERNAL_GROUP_ID", "PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE", "PROVIDER_CLINICAL_CONSENT_PREFERENCE", "PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE", "PAYER_CONSENT_PREFERENCE", "PAYER_NAME", "PAYER_ADDRESS_1", "PAYER_ADDRESS_2", "PAYER_CITY", "PAYER_STATE", "PAYER_ZIP", "PAYER_ID", "PAYER_POLICY_ID", "PAYER_GROUP_NUMBER", "PAYER_SUBSCRIBER_LAST_NAME", "PAYER_SUBSCRIBER_FIRST_NAME", "PAYER_SUBSCRIBER_MIDDLE_NAME", "PAYER_DATE_OF_BIRTH", "PAYER_GENDER_CODE", "PAYER_EFFECTIVE_DATE", "PAYER_CANCEL_DATE", "PAYER_PLAN_TYPE", "PAYER_COVERAGE_TYPE"]
      consent: *consentRules

    - id: cms-consent-fixed-v1
      filename-pattern: "consent*.fw"
      layout:
        charset: UTF-8
        format: FIXED_WIDTH
        header-mode: NONE
        fixed-width:
          record-length: 544
          columns:
            - {"name": "EXTERNAL_CONTRACT_ID", "offset": 0, "length": 20}
            - {"name": "RELATIONSHIP_CODE", "offset": 20, "length": 12}
            - {"name": "LAST_NAME", "offset": 32, "length": 24}
            - {"name": "FIRST_NAME", "offset": 56, "length": 24}
            - {"name": "MIDDLE_NAME", "offset": 80, "length": 24}
            - {"name": "GENDER_CODE", "offset": 104, "length": 4}
            - {"name": "DATE_OF_BIRTH", "offset": 108, "length": 10}
            - {"name": "EXTERNAL_GROUP_ID", "offset": 118, "length": 20}
            - {"name": "PROVIDER_CLINICAL_CONSENT_EFFECTIVE_DATE", "offset": 138, "length": 10}
            - {"name": "PROVIDER_CLINICAL_CONSENT_PREFERENCE", "offset": 148, "length": 8}
            - {"name": "PAYER_CONSENT_PREFERENCE_EFFECTIVE_DATE", "offset": 156, "length": 10}
            - {"name": "PAYER_CONSENT_PREFERENCE", "offset": 166, "length": 8}
            - {"name": "PAYER_NAME", "offset": 174, "length": 40}
            - {"name": "PAYER_ADDRESS_1", "offset": 214, "length": 40}
            - {"name": "PAYER_ADDRESS_2", "offset": 254, "length": 40}
            - {"name": "PAYER_CITY", "offset": 294, "length": 24}
            - {"name": "PAYER_STATE", "offset": 318, "length": 2}
            - {"name": "PAYER_ZIP", "offset": 320, "length": 10}
            - {"name": "PAYER_ID", "offset": 330, "length": 20}
            - {"name": "PAYER_POLICY_ID", "offset": 350, "length": 24}
            - {"name": "PAYER_GROUP_NUMBER", "offset": 374, "length": 24}
            - {"name": "PAYER_SUBSCRIBER_LAST_NAME", "offset": 398, "length": 24}
            - {"name": "PAYER_SUBSCRIBER_FIRST_NAME", "offset": 422, "length": 24}
            - {"name": "PAYER_SUBSCRIBER_MIDDLE_NAME", "offset": 446, "length": 24}
            - {"name": "PAYER_DATE_OF_BIRTH", "offset": 470, "length": 10}
            - {"name": "PAYER_GENDER_CODE", "offset": 480, "length": 4}
            - {"name": "PAYER_EFFECTIVE_DATE", "offset": 484, "length": 10}
            - {"name": "PAYER_CANCEL_DATE", "offset": 494, "length": 10}
            - {"name": "PAYER_PLAN_TYPE", "offset": 504, "length": 20}
            - {"name": "PAYER_COVERAGE_TYPE", "offset": 524, "length": 20}
      consent: *consentRules

    - id: cms-consent-xml-v1
      filename-pattern: "consent*.xml"
      layout:
        charset: UTF-8
        format: XML
        xml: { record-path: /members/member }
      consent: *consentRules

    - id: cms-consent-json-array-v1
      filename-pattern: "consent-array*.json"
      layout:
        charset: UTF-8
        format: JSON
        json: { mode: ARRAY }
      consent: *consentRules

    - id: cms-consent-json-object-v1
      filename-pattern: "consent-object*.json"
      layout:
        charset: UTF-8
        format: JSON
        json: { mode: OBJECT }
      consent: *consentRules

    - id: cms-consent-json-lines-v1
      filename-pattern: "consent*.jsonl"
      layout:
        charset: UTF-8
        format: JSON
        json: { mode: LINES }
      consent: *consentRules

upsert:
  bearer-token: ${UPSERT_BEARER_TOKEN:}

consent:
  lookup-bearer-token: ${CONSENT_LOOKUP_BEARER_TOKEN:}
