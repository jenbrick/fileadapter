spring:
  application:
    name: fileadapter
  main:
    web-application-type: none
    banner-mode: off

ingestion:
  work-directory: ${FILEADAPTER_WORK_DIR:./var}
  input-directory: ${FILEADAPTER_INPUT_DIR:./var/incoming}
  mode: ${FILEADAPTER_MODE:PREVIEW}
  poll-enabled: true
  poll-interval: 5s
  minimum-age: 2s
  ready-suffix: .ready

  delivery:
    endpoint: ${UPSERT_URL:http://localhost:8081/employees/upsert}
    connect-timeout: 5s
    read-timeout: 30s
    max-attempts: 3
    retry-delay: 1s
    # Enable ONLY after the service guarantees idempotency for this header.
    replay-safe: false
    idempotency-header: Idempotency-Key
    success-statuses: [200, 201, 204]

  profiles:
    - id: enrollment-csv-v1
      filename-pattern: "enrollment*.csv"
      layout:
        format: DELIMITED
        charset: UTF-8
        delimiter: ","
        header-mode: FIRST_RECORD
        fields: &csvFields
          employeeId:
            column: employee_id
            aliases: [employee_number, emp_id]
          firstName:
            column: first_name
          lastName:
            column: last_name
          email:
            column: email_address
            aliases: [email]
          city:
            column: city
          state:
            column: state
          planCode:
            column: plan_code
          effectiveDate:
            column: effective_date

      mappings: &employeeMappings
        - source: employeeId
          target: employeeId
          required: true
          transforms: [trim]
        - source: firstName
          target: person.firstName
          required: true
          transforms: [trim]
        - source: lastName
          target: person.lastName
          required: true
          transforms: [trim]
        - source: email
          target: person.contact.email
          blank-policy: OMIT
          transforms: [trim]
        - source: city
          target: person.address.city
          transforms: [trim]
        - source: state
          target: person.address.state
          transforms: [trim, uppercase]
        - source: planCode
          target: coverage.planCode
          required: true
          transforms: [trim]
        - source: effectiveDate
          target: coverage.effectiveDate
          required: true
          transforms: [trim, iso-date]

      contract: &employeeContract
        - path: employeeId
          type: STRING
          required: true
        - path: person
          type: OBJECT
          required: true
        - path: person.firstName
          type: STRING
          required: true
        - path: person.lastName
          type: STRING
          required: true
        - path: person.contact.email
          type: STRING
        - path: coverage.planCode
          type: STRING
          required: true
        - path: coverage.effectiveDate
          type: STRING
          required: true


    - id: enrollment-fixed-v1
      filename-pattern: "enrollment*.fw"
      layout:
        format: FIXED_WIDTH
        charset: UTF-8
        header-mode: NONE
        fields: *csvFields
        fixed-width:
          record-length: 106
          columns:
            - { name: employee_id, offset: 0, length: 8 }
            - { name: first_name, offset: 8, length: 12 }
            - { name: last_name, offset: 20, length: 16 }
            - { name: email, offset: 36, length: 28 }
            - { name: city, offset: 64, length: 14 }
            - { name: state, offset: 78, length: 2 }
            - { name: plan_code, offset: 80, length: 16 }
            - { name: effective_date, offset: 96, length: 10 }
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-pipe-header-v1
      filename-pattern: "enrollment-header*.psv"
      layout:
        format: DELIMITED
        charset: UTF-8
        delimiter: "|"
        header-mode: FIRST_RECORD
        fields: *csvFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-pipe-noheader-v1
      filename-pattern: "enrollment-noheader*.psv"
      layout:
        format: DELIMITED
        charset: UTF-8
        delimiter: "|"
        header-mode: NONE
        columns: [employee_id, first_name, last_name, email, city, state, plan_code, effective_date]
        fields: *csvFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-xml-v1
      filename-pattern: "enrollment*.xml"
      layout:
        format: XML
        charset: UTF-8
        xml:
          record-path: /employees/employee
        fields:
          employeeId: { column: "/@id" }
          firstName: { column: /person/firstName }
          lastName: { column: /person/lastName }
          email: { column: /person/contact/email }
          city: { column: /person/address/city }
          state: { column: /person/address/state }
          planCode: { column: /coverage/planCode }
          effectiveDate: { column: /coverage/effectiveDate }
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-json-array-v1
      filename-pattern: "enrollment-array*.json"
      layout:
        format: JSON
        charset: UTF-8
        json: { mode: ARRAY }
        fields: &jsonFields
          employeeId: { column: employeeId }
          firstName: { column: /person/firstName }
          lastName: { column: /person/lastName }
          email: { column: /person/contact/email }
          city: { column: /person/address/city }
          state: { column: /person/address/state }
          planCode: { column: /coverage/planCode }
          effectiveDate: { column: /coverage/effectiveDate }
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-json-object-v1
      filename-pattern: "enrollment-object*.json"
      layout:
        format: JSON
        charset: UTF-8
        json: { mode: OBJECT }
        fields: *jsonFields
      mappings: *employeeMappings
      contract: *employeeContract

    - id: enrollment-json-lines-v1
      filename-pattern: "enrollment*.jsonl"
      layout:
        format: JSON
        charset: UTF-8
        json: { mode: LINES }
        fields: *jsonFields
      mappings: *employeeMappings
      contract: *employeeContract

upsert:
  bearer-token: ${UPSERT_BEARER_TOKEN:}
