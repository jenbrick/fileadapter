spring:
  profiles:
    default: flexible-demo
  application:
    name: fileadapter
  main:
    web-application-type: none
    banner-mode: off

ingestion:
  work-directory: ${FILEADAPTER_WORK_DIR:./var}
  input-directory: ${FILEADAPTER_INPUT_DIR:./var/incoming}
  mode: ${FILEADAPTER_MODE:PREVIEW}
  poll-enabled: true
  poll-interval: 5s
  minimum-age: 2s
  # The producer creates this marker after it has finished and closed the input file.
  ready-suffix: .ready

  # These settings are frozen with each run; credentials are read separately at runtime.
  delivery:
    endpoint: ${UPSERT_URL:http://localhost:8081/consents/upsert}
    connect-timeout: 5s
    read-timeout: 30s
    max-attempts: 3
    retry-delay: 1s
    # Enable ONLY after the service guarantees idempotency for this header.
    replay-safe: false
    idempotency-header: Idempotency-Key
    success-statuses: [200, 201, 204]


upsert:
  bearer-token: ${UPSERT_BEARER_TOKEN:}

consent:
  lookup-bearer-token: ${CONSENT_LOOKUP_BEARER_TOKEN:}

# Mounted LAN/outbox paths. Another process sends customer files and emails IT reports.
results:
  customer-directory: ${CUSTOMER_RESULTS_DIR:}
  internal-directory: ${INTERNAL_RESULTS_DIR:}

group:
  lookup-bearer-token: ${GROUP_LOOKUP_BEARER_TOKEN:}
